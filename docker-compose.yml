services:
  postgres:
    image: postgres:17
    container_name: filmoteka-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - filmoteka-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../filmoteka-backend
    container_name: filmoteka-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "${BACKEND_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  media:
    build:
      context: ../filmoteka-media
    container_name: filmoteka-media
    environment:
      MEDIA_ROOT_LOCATION: /app/uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "${MEDIA_PORT}:8081"
    volumes:
      - filmoteka-media-uploads:/app/uploads

  ui:
    build:
      context: ../filmoteka-ui
      args:
        VITE_BACKEND_API_URL: ${VITE_BACKEND_API_URL}
        VITE_MEDIA_API_URL: ${VITE_MEDIA_API_URL}
    container_name: filmoteka-ui
    ports:
      - "${UI_PORT}:80"
    depends_on:
      - backend
      - media

volumes:
  filmoteka-postgres-data:
  filmoteka-media-uploads: