services:
  catalog-postgres:
    image: postgres:17
    container_name: filmoteka-catalog-postgres
    environment:
      POSTGRES_DB: ${CATALOG_DB_NAME}
      POSTGRES_USER: ${CATALOG_DB_USERNAME}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD}
    ports:
      - "${CATALOG_DB_PORT}:5432"
    volumes:
      - filmoteka-catalog-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CATALOG_DB_USERNAME} -d ${CATALOG_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-postgres:
    image: postgres:17
    container_name: filmoteka-user-postgres
    environment:
      POSTGRES_DB: ${USER_DB_NAME}
      POSTGRES_USER: ${USER_DB_USERNAME}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}
    ports:
      - "${USER_DB_PORT}:5432"
    volumes:
      - filmoteka-user-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${USER_DB_USERNAME} -d ${USER_DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak-postgres:
    image: postgres:17
    container_name: filmoteka-keycloak-postgres
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME}
      POSTGRES_USER: ${KEYCLOAK_DB_USERNAME}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - filmoteka-keycloak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USERNAME} -d ${KEYCLOAK_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog:
    build:
      context: ../filmoteka-catalog
    container_name: filmoteka-catalog
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://catalog-postgres:5432/${CATALOG_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${CATALOG_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${CATALOG_DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI}
      AUTH_JWK_SET_URI: ${AUTH_JWK_SET_URI}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_FILM_DELETED_TOPIC: ${KAFKA_FILM_DELETED_TOPIC}
      KAFKA_FILM_POSTER_CHANGED_TOPIC: ${KAFKA_FILM_POSTER_CHANGED_TOPIC}
    ports:
      - "${CATALOG_PORT}:8080"
    depends_on:
      catalog-postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness" ]
      timeout: 5s
      start_period: 60s

  media:
    build:
      context: ../filmoteka-media
    container_name: filmoteka-media
    environment:
      MEDIA_ROOT_LOCATION: /app/uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI}
      AUTH_JWK_SET_URI: ${AUTH_JWK_SET_URI}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_FILM_DELETED_TOPIC: ${KAFKA_FILM_DELETED_TOPIC}
      KAFKA_FILM_POSTER_CHANGED_TOPIC: ${KAFKA_FILM_POSTER_CHANGED_TOPIC}
      KAFKA_MEDIA_CONSUMER_GROUP_ID: ${KAFKA_MEDIA_CONSUMER_GROUP_ID}
      KAFKA_AUTO_OFFSET_RESET: ${KAFKA_AUTO_OFFSET_RESET}
    ports:
      - "${MEDIA_PORT}:8081"
    volumes:
      - filmoteka-media-uploads:/app/uploads
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8081/actuator/health/readiness" ]
      timeout: 5s
      start_period: 60s

  ui:
    build:
      context: ../filmoteka-ui
      args:
        VITE_CATALOG_API_URL: ${VITE_CATALOG_API_URL}
        VITE_MEDIA_API_URL: ${VITE_MEDIA_API_URL}
        VITE_USER_API_URL: ${VITE_USER_API_URL}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL}
    container_name: filmoteka-ui
    ports:
      - "${UI_PORT}:80"
    depends_on:
      - catalog
      - media

  user:
    build:
      context: ../filmoteka-user
    container_name: filmoteka-user
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-postgres:5432/${USER_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${USER_DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CATALOG_API_URL: ${CATALOG_API_URL}
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI}
      AUTH_JWK_SET_URI: ${AUTH_JWK_SET_URI}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_FILM_DELETED_TOPIC: ${KAFKA_FILM_DELETED_TOPIC}
      KAFKA_USER_CONSUMER_GROUP_ID: ${KAFKA_USER_CONSUMER_GROUP_ID}
      KAFKA_AUTO_OFFSET_RESET: ${KAFKA_AUTO_OFFSET_RESET}
    ports:
      - "${USER_PORT}:8082"
    depends_on:
      user-postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8082/actuator/health/readiness" ]
      timeout: 5s
      start_period: 60s

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: filmoteka-keycloak
    command: start-dev --import-realm --feature-identity-brokering-api=v2 --feature-twitter-broker=disabled
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USERNAME}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
      - ./keycloak/themes:/opt/keycloak/themes:ro
    ports:
      - "${KEYCLOAK_PORT}:8080"
    depends_on:
      keycloak-postgres:
        condition: service_healthy

  kafka:
    image: apache/kafka:4.3.1
    container_name: filmoteka-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      CLUSTER_ID: "5IK6aAw0Rjyn1Me8VgZOww"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:29092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - filmoteka-kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [ "CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:29092", "--list" ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  filmoteka-catalog-postgres-data:
  filmoteka-user-postgres-data:
  filmoteka-keycloak-postgres-data:
  filmoteka-media-uploads:
  filmoteka-kafka-data: